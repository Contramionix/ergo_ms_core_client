<!doctype html>
<html lang="ru" >
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERGOMS</title>
    <style>
      html.app-bootstrapping #app {
        opacity: 0;
      }
      html #app {
        transition: opacity 0.28s ease;
      }
      html.app-bootstrapping #app,
      html.app-bootstrapping #app * {
        transition: none !important;
        animation: none !important;
      }
      #ergo-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--color-background, #f2f2f2);
      }
      html.app-bootstrapping #ergo-boot-loader {
        display: flex;
      }
      #ergo-boot-loader[hidden] {
        display: none !important;
      }
      .ergo-boot-loader__spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 0.25rem solid rgba(0, 0, 0, 0.08);
        border-top-color: var(--color-accent, #0d6efd);
        border-radius: 50%;
        animation: ergo-boot-spin 0.75s linear infinite;
      }
      html[data-bs-theme='dark'] #ergo-boot-loader {
        background: var(--color-background, #212529);
      }
      html[data-bs-theme='dark'] .ergo-boot-loader__spinner {
        border-color: rgba(255, 255, 255, 0.12);
        border-top-color: var(--color-accent, #6ea8fe);
      }
      @keyframes ergo-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html #app {
          transition: none;
        }
        .ergo-boot-loader__spinner {
          animation: none;
          border-top-color: var(--color-accent, #0d6efd);
        }
      }
    </style>
    <script src="/js/bootstrap-early.js"></script>
    <script type="module" src="/src/js/color-theme.js"></script>
  </head>
  <body>
    <div
      id="ergo-boot-loader"
      aria-live="polite"
      aria-busy="true"
      aria-label="Загрузка приложения"
    >
      <div class="ergo-boot-loader__spinner" role="status"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
